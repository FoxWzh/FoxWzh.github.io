<section class="sidebar-music" aria-label="背景音乐">
  <div class="sidebar-music-head">
    <i class="fas fa-music fa-fw"></i>
    <span>背景音乐</span>
  </div>

  <div class="sidebar-music-now">
    <div class="now-title" id="sm-title">{{ site.data.music.first.title }}</div>
    <div class="now-artist" id="sm-artist">{{ site.data.music.first.artist }}</div>
  </div>

  <div class="sidebar-music-controls">
    <button type="button" class="sm-btn" id="sm-loop" aria-label="切换循环模式" title="列表循环">
      <i class="fas fa-repeat"></i>
    </button>
    <button type="button" class="sm-btn" id="sm-prev" aria-label="上一首">
      <i class="fas fa-step-backward"></i>
    </button>
    <button type="button" class="sm-btn sm-play" id="sm-play" aria-label="播放或暂停">
      <i class="fas fa-play"></i>
    </button>
    <button type="button" class="sm-btn" id="sm-next" aria-label="下一首">
      <i class="fas fa-step-forward"></i>
    </button>
  </div>

  <div class="sidebar-music-progress">
    <span class="sm-time" id="sm-current">0:00</span>
    <div class="sm-bar" id="sm-bar">
      <div class="sm-bar-fill" id="sm-fill"></div>
    </div>
    <span class="sm-time" id="sm-duration">0:00</span>
  </div>

  <div class="sm-volume-row">
    <button type="button" class="sm-btn sm-volume-btn" id="sm-volume-btn" aria-label="静音">
      <i class="fas fa-volume-up"></i>
    </button>
    <input
      type="range"
      class="sm-volume"
      id="sm-volume"
      min="0"
      max="1"
      step="0.05"
      value="0.8"
      aria-label="音量"
    >
  </div>

  <ul class="sidebar-music-list">
    {% for song in site.data.music %}
      <li
        data-id="{{ song.id }}"
        data-title="{{ song.title }}"
        data-artist="{{ song.artist }}"
        {% if forloop.first %}class="active"{% endif %}
      >
        <span class="song-title">{{ song.title }}</span>
        <span class="song-artist">{{ song.artist }}</span>
      </li>
    {% endfor %}
  </ul>
</section>

<script>
  (function () {
    var list = document.querySelectorAll(".sidebar-music-list li");
    var titleEl = document.getElementById("sm-title");
    var artistEl = document.getElementById("sm-artist");
    var playBtn = document.getElementById("sm-play");
    var prevBtn = document.getElementById("sm-prev");
    var nextBtn = document.getElementById("sm-next");
    var loopBtn = document.getElementById("sm-loop");
    var volumeBtn = document.getElementById("sm-volume-btn");
    var volumeBar = document.getElementById("sm-volume");
    var currentEl = document.getElementById("sm-current");
    var durationEl = document.getElementById("sm-duration");
    var bar = document.getElementById("sm-bar");
    var fill = document.getElementById("sm-fill");
    if (!list.length) return;

    var audio = new Audio();
    var current = 0;
    var isPlaying = false;
    var loopMode = "list"; // list | one
    audio.volume = 0.8;

    function fmt(sec) {
      if (!isFinite(sec) || sec < 0) sec = 0;
      var m = Math.floor(sec / 60);
      var s = Math.floor(sec % 60);
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function load(index) {
      var li = list[index];
      if (!li) return;
      current = index;
      list.forEach(function (x, i) {
        x.classList.toggle("active", i === index);
      });
      titleEl.textContent = li.getAttribute("data-title");
      artistEl.textContent = li.getAttribute("data-artist");
      audio.src =
        "https://music.163.com/song/media/outer/url?id=" +
        li.getAttribute("data-id") +
        ".mp3";
      currentEl.textContent = "0:00";
      durationEl.textContent = "0:00";
      fill.style.width = "0%";
      if (isPlaying) {
        audio.play().catch(function () {});
      }
    }

    function play() {
      audio
        .play()
        .then(function () {
          isPlaying = true;
          playBtn.innerHTML = '<i class="fas fa-pause"></i>';
        })
        .catch(function () {
          isPlaying = false;
          playBtn.innerHTML = '<i class="fas fa-play"></i>';
        });
    }

    function pause() {
      audio.pause();
      isPlaying = false;
      playBtn.innerHTML = '<i class="fas fa-play"></i>';
    }

    function startPlaying() {
      playBtn.innerHTML = '<i class="fas fa-pause"></i>';
      isPlaying = true;
    }

    playBtn.addEventListener("click", function () {
      if (isPlaying) {
        pause();
      } else {
        play();
      }
    });

    prevBtn.addEventListener("click", function () {
      load((current - 1 + list.length) % list.length);
    });

    nextBtn.addEventListener("click", function () {
      load((current + 1) % list.length);
    });

    loopBtn.addEventListener("click", function () {
      loopMode = loopMode === "list" ? "one" : "list";
      loopBtn.classList.toggle("active", loopMode === "one");
      loopBtn.title = loopMode === "one" ? "单曲循环" : "列表循环";
      loopBtn.innerHTML =
        loopMode === "one"
          ? '<i class="fas fa-repeat-1"></i>'
          : '<i class="fas fa-repeat"></i>';
    });

    volumeBtn.addEventListener("click", function () {
      audio.muted = !audio.muted;
      volumeBtn.innerHTML = audio.muted
        ? '<i class="fas fa-volume-xmark"></i>'
        : audio.volume === 0
          ? '<i class="fas fa-volume-off"></i>'
          : '<i class="fas fa-volume-up"></i>';
    });

    volumeBar.addEventListener("input", function () {
      audio.volume = parseFloat(volumeBar.value);
      audio.muted = false;
      volumeBtn.innerHTML =
        audio.volume === 0
          ? '<i class="fas fa-volume-off"></i>'
          : '<i class="fas fa-volume-up"></i>';
    });

    list.forEach(function (li, i) {
      li.addEventListener("click", function () {
        if (i !== current) {
          load(i);
        } else {
          play();
        }
      });
    });

    audio.addEventListener("timeupdate", function () {
      currentEl.textContent = fmt(audio.currentTime);
      if (audio.duration) {
        durationEl.textContent = fmt(audio.duration);
        fill.style.width = (audio.currentTime / audio.duration) * 100 + "%";
      }
    });

    audio.addEventListener("ended", function () {
      if (loopMode === "one") {
        audio.currentTime = 0;
        audio.play().catch(function () {});
      } else {
        load((current + 1) % list.length);
      }
    });

    bar.addEventListener("click", function (e) {
      if (!audio.duration) return;
      var rect = bar.getBoundingClientRect();
      var ratio = (e.clientX - rect.left) / rect.width;
      audio.currentTime = ratio * audio.duration;
    });

    // 初始化第一首，并尝试自动播放
    load(0);
    var resumeOnInteraction = function () {
      audio.play().then(startPlaying).catch(function () {});
      document.removeEventListener("pointerdown", resumeOnInteraction);
      document.removeEventListener("keydown", resumeOnInteraction);
    };
    audio
      .play()
      .then(startPlaying)
      .catch(function () {
        document.addEventListener("pointerdown", resumeOnInteraction);
        document.addEventListener("keydown", resumeOnInteraction);
      });
  })();
</script>
