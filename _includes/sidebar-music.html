<section class="sidebar-music" aria-label="背景音乐">
  <div class="sidebar-music-head">
    <i class="fas fa-music fa-fw"></i>
    <span>背景音乐</span>
  </div>

  <div class="sidebar-music-now">
    <div class="now-title" id="sm-title">{{ site.data.music.first.title }}</div>
    <div class="now-artist" id="sm-artist">{{ site.data.music.first.artist }}</div>
  </div>

  <div class="sidebar-music-controls">
    <button type="button" class="sm-btn" id="sm-loop" aria-label="切换循环模式" title="列表循环">
      <i class="fas fa-repeat"></i>
    </button>
    <button type="button" class="sm-btn" id="sm-prev" aria-label="上一首">
      <i class="fas fa-step-backward"></i>
    </button>
    <button type="button" class="sm-btn sm-play" id="sm-play" aria-label="播放或暂停">
      <i class="fas fa-play"></i>
    </button>
    <button type="button" class="sm-btn" id="sm-next" aria-label="下一首">
      <i class="fas fa-step-forward"></i>
    </button>
  </div>

  <div class="sidebar-music-progress">
    <span class="sm-time" id="sm-current">0:00</span>
    <div class="sm-bar" id="sm-bar">
      <div class="sm-bar-fill" id="sm-fill"></div>
    </div>
    <span class="sm-time" id="sm-duration">0:00</span>
  </div>

  <div class="sm-volume-row">
    <button type="button" class="sm-btn sm-volume-btn" id="sm-volume-btn" aria-label="静音">
      <i class="fas fa-volume-up"></i>
    </button>
    <input
      type="range"
      class="sm-volume"
      id="sm-volume"
      min="0"
      max="1"
      step="0.05"
      value="0.8"
      aria-label="音量"
    >
  </div>

  <ul class="sidebar-music-list">
    {% for song in site.data.music %}
      <li
        data-id="{{ song.id }}"
        data-title="{{ song.title }}"
        data-artist="{{ song.artist }}"
        {% if forloop.first %}class="active"{% endif %}
      >
        <span class="song-title">{{ song.title }}</span>
        <span class="song-artist">{{ song.artist }}</span>
      </li>
    {% endfor %}
  </ul>
</section>

<script src="{{ '/assets/js/sidebar-music.js' | relative_url }}"></script>
